# golangci-lint v2 config for synthwerk-* Go repos.
# Copy to the repo root as .golangci.yml. Source: synthwerk-blueprint/configs/go.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - sloglint
    - sqlclosecheck
    - unparam
    - usestdlibvars
  exclusions:
    generated: strict
    presets:
      - comments
      - std-error-handling
    rules:
      # tests/support/harness closes every response body in t.Cleanup.
      - path: ^tests/
        linters: [bodyclose]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/VelimirMueller/synthwerk-

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
