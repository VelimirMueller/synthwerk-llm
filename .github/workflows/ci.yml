# Thin caller of the synthwerk blueprint. The blueprint runs gofmt, golangci-lint,
# go test -race ./... and go build, and builds, scans and (on push) signs the image.
# Required checks for the ruleset: "ci / required" (blueprint jobs) and "gate" (all jobs).
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  # Blueprint: gofmt, golangci-lint, go test -race ./..., go build.
  ci:
    permissions:
      contents: read
    uses: VelimirMueller/synthwerk-blueprint/.github/workflows/go-ci.yml@v1

  # Blueprint: build, SBOM, Trivy scan. Push to main or a v* tag: also push to
  # ghcr.io/velimirmueller/synthwerk-llm, sign with cosign and attest the build provenance.
  image:
    # GitHub checks these at start, also on pull requests, where nothing is pushed.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: VelimirMueller/synthwerk-blueprint/.github/workflows/image.yml@v1

  # One check over the blueprint jobs ("ci / required" covers the go-ci blueprint only).
  gate:
    if: always()
    needs: [ci, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == "success" ]] || exit 1
          done
