# fleet.yml: tier and visibility of this repo (STANDARD.md). Exceptions: docs/rollout.md.
tier: deploys
visibility: public

exceptions:
  - rule: WF-NAME-02
    value:
      ci.yml: [integration, eval]
    reason: The unit stage runs without network services (CI-UNIT-05); the integration job tests the chat slice against real Postgres and NATS on every PR. No fleet stage runs a model eval; the eval job scores the alias default on a real model (Ollama) when a PR touches what it scores.
  - rule: CI-COST-15
    value: 5
    reason: The integration and eval jobs are the fourth and fifth PR jobs; they are the only tests against real Postgres, NATS and a real model, and the repo is public (free minutes).
    expires: 2027-04-30
  - rule: CI-UNIT-03
    value:
      lines: 50
    reason: Unit and contract tests cover 56.5 % of internal/ today; store and the chat HTTP path are tested only by the integration job. ci.yml sets coverage-floor 50; raise it as unit tests land.
  - rule: GOV-REPO-01
    value: default-branch-main
    reason: The default branch stays main until the control repo creates develop and stage (fleet-standard#7).
  - rule: GOV-RS-02
    value: not-created-yet
    reason: develop does not exist yet; the control repo creates it with its ruleset (fleet-standard#7).
  - rule: GOV-RS-03
    value: not-created-yet
    reason: develop does not exist yet; the control repo creates it with its ruleset (fleet-standard#7).
  - rule: GOV-RS-04
    value: not-created-yet
    reason: stage does not exist yet and main has only classic branch protection without required checks; the control repo creates both rulesets (fleet-standard#7).
  - rule: GOV-ENV-01
    value: not-created-yet
    reason: The environments dev, stg and prd do not exist yet; the control repo creates them (fleet-standard#7).
